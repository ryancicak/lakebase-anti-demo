<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Lakebase: The Anti-Demo — pixel corner badge</title>
  <desc id="desc">An original square 8-bit badge featuring a top-down boxing ring, two opposing corners, and the Lakebase Anti-Demo title.</desc>
  <rect width="900" height="900" fill="#10152F"/>
  <rect x="24" y="24" width="852" height="852" fill="none" stroke="#F5D742" stroke-width="18"/>
  <rect x="50" y="50" width="800" height="800" fill="none" stroke="#E8482E" stroke-width="10"/>

  <g font-family="Menlo, Monaco, Courier New, monospace" font-weight="900" text-anchor="middle">
    <text x="450" y="166" fill="#FFF4C2" stroke="#4A83E8" stroke-width="13" paint-order="stroke" font-size="92" letter-spacing="-7">LAKEBASE</text>
    <text x="450" y="231" fill="#F5D742" stroke="#E8482E" stroke-width="10" paint-order="stroke" font-size="40" letter-spacing="0">THE ANTI-DEMO!!</text>
  </g>

  <!-- Pixel-perfect overhead ring. -->
  <g transform="translate(188 278)">
    <rect x="0" y="0" width="524" height="396" fill="#1C254F" stroke="#EAE4CF" stroke-width="18"/>
    <rect x="34" y="34" width="456" height="328" fill="none" stroke="#4A83E8" stroke-width="14"/>
    <rect x="68" y="68" width="388" height="260" fill="none" stroke="#F5D742" stroke-width="10"/>
    <rect x="-18" y="-18" width="62" height="62" fill="#E8482E"/>
    <rect x="480" y="352" width="62" height="62" fill="#E8482E"/>
    <rect x="480" y="-18" width="62" height="62" fill="#EAE4CF"/>
    <rect x="-18" y="352" width="62" height="62" fill="#EAE4CF"/>

    <!-- Same task / two lanes / one outcome. -->
    <rect x="118" y="138" width="108" height="120" fill="#E8482E"/>
    <rect x="298" y="138" width="108" height="120" fill="#4A83E8"/>
    <rect x="245" y="174" width="34" height="18" fill="#FFF4C2"/>
    <rect x="245" y="210" width="34" height="18" fill="#FFF4C2"/>
  </g>

  <g font-family="Menlo, Monaco, Courier New, monospace" font-weight="900" text-anchor="middle">
    <text x="450" y="748" fill="#EAE4CF" font-size="27">SAME TASK  ·  SAME DATA</text>
    <text x="450" y="794" fill="#F5D742" font-size="29">VERIFIED LIVE</text>
  </g>
</svg>
