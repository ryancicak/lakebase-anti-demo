<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Lakebase versus Aurora — retro console-boxing ready screen</title>
  <desc id="desc">An original 8-bit ringside ready screen with a foreground Lakebase database fighter, a larger Aurora opponent, a crowd, round clock, and Ring the Bell action.</desc>

  <rect width="1920" height="1080" fill="#070B22"/>

  <!-- Minimal fight HUD. These clocks are presentation-only until the bell. -->
  <rect x="0" y="0" width="1920" height="190" fill="#050711"/>
  <rect x="0" y="178" width="1920" height="12" fill="#F8D83B"/>
  <rect x="38" y="28" width="650" height="126" fill="#151E48" stroke="#EE452D" stroke-width="10"/>
  <rect x="1232" y="28" width="650" height="126" fill="#151E48" stroke="#4A83E8" stroke-width="10"/>
  <text x="76" y="78" fill="#FFF4C2" font-family="Menlo, Monaco, Courier New, monospace" font-size="28" font-weight="900">LAKEBASE</text>
  <text x="76" y="133" fill="#F8D83B" font-family="Menlo, Monaco, Courier New, monospace" font-size="42" font-weight="900">00:00.000</text>
  <text x="1844" y="78" fill="#FFF4C2" font-family="Menlo, Monaco, Courier New, monospace" font-size="28" font-weight="900" text-anchor="end">AURORA SERVERLESS v2</text>
  <text x="1844" y="133" fill="#F8D83B" font-family="Menlo, Monaco, Courier New, monospace" font-size="42" font-weight="900" text-anchor="end">00:00.000</text>
  <text x="960" y="71" fill="#F8D83B" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="900" text-anchor="middle">ROUND 1</text>
  <text x="960" y="124" fill="#F1EBD7" font-family="Menlo, Monaco, Courier New, monospace" font-size="24" font-weight="900" text-anchor="middle">WAKE THIS IDLE APP</text>

