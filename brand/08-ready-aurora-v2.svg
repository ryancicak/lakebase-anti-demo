    <rect x="1744" y="346" width="14" height="14"/><rect x="1824" y="316" width="18" height="18"/>
  </g>
  <g fill="#EE452D">
    <rect x="108" y="382" width="20" height="20"/><rect x="326" y="390" width="18" height="18"/><rect x="552" y="382" width="20" height="20"/>
    <rect x="772" y="392" width="18" height="18"/><rect x="1008" y="382" width="20" height="20"/><rect x="1234" y="392" width="18" height="18"/>
    <rect x="1460" y="382" width="20" height="20"/><rect x="1686" y="392" width="18" height="18"/><rect x="1840" y="382" width="20" height="20"/>
  </g>

