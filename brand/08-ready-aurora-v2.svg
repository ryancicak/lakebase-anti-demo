    <path d="M104 410V330H160V272H224V224H500V272H564V330H620V410Z" fill="#070B22"/>
    <rect x="166" y="282" width="392" height="176" fill="#EE452D"/>
    <rect x="222" y="258" width="280" height="200" fill="#10152F"/>
    <rect x="306" y="310" width="112" height="94" fill="#F1EBD7"/>
