    <rect x="80" y="318" width="18" height="18"/><rect x="138" y="350" width="14" height="14"/><rect x="236" y="306" width="18" height="18"/>
    <rect x="352" y="344" width="16" height="16"/><rect x="472" y="316" width="14" height="14"/><rect x="584" y="356" width="18" height="18"/>
    <rect x="706" y="310" width="16" height="16"/><rect x="824" y="348" width="14" height="14"/><rect x="912" y="312" width="18" height="18"/>
