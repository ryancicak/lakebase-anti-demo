  <!-- Ready prompt: one action, no fake health bars. -->
  <rect x="660" y="884" width="600" height="104" fill="#EE452D"/>
  <rect x="678" y="902" width="564" height="68" fill="#F8D83B"/>
  <text x="960" y="950" fill="#10152F" font-family="Menlo, Monaco, Courier New, monospace" font-size="39" font-weight="900" text-anchor="middle">▶ RING THE BELL</text>
