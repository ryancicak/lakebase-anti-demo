<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Lockjaw Lucy — DBA ringside portrait</title><desc id="desc">An original 8-bit ringside timekeeper with shoulder-length asymmetric hair, a geometric jaw, enormous collar, and padlock clasp.</desc>
