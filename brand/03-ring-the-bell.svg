<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Lakebase: The Anti-Demo — Ring the Bell logo concept</title>
  <desc id="desc">A minimal boxing ring surrounds an original bell symbol, paired with the Lakebase Anti-Demo wordmark.</desc>
  <rect width="1600" height="600" rx="28" fill="#F7F3EA"/>

  <!-- Side-view ring: four posts, three ropes, no game characters or borrowed artwork. -->
  <g transform="translate(70 72)">
    <g stroke="#101214" stroke-width="18" stroke-linecap="square">
      <path d="M42 74V382"/>
      <path d="M466 74V382"/>
    </g>
    <g stroke="#FF3621" stroke-width="14" stroke-linecap="square">
      <path d="M42 126H466"/>
      <path d="M42 178H466"/>
      <path d="M42 230H466"/>
    </g>
    <g fill="#FF3621">
      <rect x="24" y="54" width="36" height="36" rx="3"/>
      <rect x="448" y="54" width="36" height="36" rx="3"/>
    </g>

    <!-- Original bell: the start signal, not a literal boxing trophy. -->
    <path d="M254 94C211 94 180 127 180 178V253L151 292H357L328 253V178C328 127 297 94 254 94Z" fill="#101214"/>
    <path d="M218 310H290C286 334 273 348 254 348C235 348 222 334 218 310Z" fill="#FF3621"/>
    <circle cx="254" cy="78" r="17" fill="#101214"/>
    <path d="M133 292H375" stroke="#101214" stroke-width="15" stroke-linecap="square"/>
  </g>

  <g font-family="Arial Black, Helvetica Neue, Arial, sans-serif">
    <text x="625" y="249" fill="#101214" font-size="127" font-weight="900" letter-spacing="-6">LAKEBASE</text>
    <text x="628" y="354" fill="#101214" font-size="61" font-weight="900" letter-spacing="5">THE ANTI-DEMO</text>
  </g>
  <text x="632" y="430" fill="#FF3621" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="4.8">NAME THE COMPETITOR. RING THE BELL.</text>
</svg>
